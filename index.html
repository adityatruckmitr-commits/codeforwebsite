<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Easy Learning — NEP 2020 Compliant Educational Portal</title>
        <meta name="description" content="Easy Learning is an accessible educational portal aligned with NEP 2020, offering NCERT textbooks, video books, interactive notes, and accessible learning tools.">
        <!--- Site Icon -->
        <link rel="icon" href="data/image/icons/hat.png" type="image/x-icon">
        <!--- school Icon -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
        <!--- Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Lavishly+Yours&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Butcherman&family=Eater&family=Ribeye+Marrow&family=Rubik+Burned&family=Rubik+Glitch&family=Rubik+Pixels&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Martel:wght@200;300;400;600;700;800;900&family=Playpen+Sans+Deva:wght@100..800&family=Rozha+One&family=Tillana:wght@400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />
        <!--- Token Sheets -->
        <link rel="stylesheet" href="css/tokens.css" />
        <!---Theme Sheet --->
        <link id="app-theme" rel="stylesheet" href="" />

        <script type="module">
            import { appState } from "./js/app_state.js";

            const theme = (appState.themefile || "theme-file.css").trim();
            const link = document.getElementById("app-theme");
            link.href = `css/${theme}`;
        </script>
        <!--- Application Style Sheet -->
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/base-1550x900.css" media="(max-width: 1600px) and (max-height: 900px)">
        <link rel="stylesheet" href="css/base-1366x768.css" media="(max-width: 1366px) and (max-height: 768px)">
        <!---link rel="stylesheet" href="css/spell.css" /-->
    </head>
    <body>
        <!-- Skip Link for Keyboard Accessibility (WCAG 2.4.1 / GIGW 5.2.1) -->
        <nav aria-label="Skip links" class="skip-link-container">
            <a href="#main-content" class="skip-link">Skip to main content</a>
        </nav>

        <!-- Screen Reader Live Announcements (WCAG 4.1.3) -->
        <div id="a11y-live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

        <div id="appshell" class="app-shell grid"></div>

         <!-- React 18 -->
        <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

        <!-- React Flow (UMD) -->
        <script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>

        <!-- Dagre (layout) -->
        <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>

        <!-- MathJax config MUST come before MathJax script -->
        <script>
        window.MathJax = {
            tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            },
            chtml: {
            scale: 1,
            mtextInheritFont: true,
            matchFontHeight: true
            },
            options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
            }
        };
        </script>

        <!-- Load MathJax -->
        <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
        
        <!-- Your app -->
        <script type="module" src="js/app_script.js"></script>
    </body>
</html>
